*{box-sizing:border-box}
:root{
  --bg:#24150f;--panel:#43271a;--hi:#5a3623;--lo:#33200f;--line:#150a06;
  --ink:#ffe9c7;--muted:#d3a979;--accent:#f28c28;--accent-ink:#2b1306;--accent2:#ffd45e;--dot:#2f1d14;
}
body[data-season="winter"]{--bg:#0f1530;--panel:#1d2a52;--hi:#2a3a6c;--lo:#16204a;--line:#080c1e;--ink:#eaf2ff;--muted:#9fb4dc;--accent:#8fc7ff;--accent-ink:#0c1a38;--accent2:#ff7b7b;--dot:#17204a}
body[data-season="spring"]{--bg:#223a2a;--panel:#34553f;--hi:#46704f;--lo:#284532;--line:#122018;--ink:#fff4e0;--muted:#bfe0b0;--accent:#ff8fb1;--accent-ink:#3a1020;--accent2:#ffd45e;--dot:#2a4632}
body[data-season="summer"]{--bg:#1f4558;--panel:#2f6178;--hi:#417b94;--lo:#244f64;--line:#102a38;--ink:#fff6dc;--muted:#bfe3ee;--accent:#ffc65a;--accent-ink:#3a2306;--accent2:#ff7a59;--dot:#27566b}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;
  font-size:10px;line-height:1.8;min-height:100vh;
  background-image:radial-gradient(var(--dot) 1.5px,transparent 1.5px);background-size:16px 16px;
  transition:background-color .6s,color .6s;
}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 4px 22px}
h1{font-size:16px;margin:0;color:var(--accent2);text-shadow:3px 3px 0 var(--line);letter-spacing:1px}
.brand .tag{font-size:8px;color:var(--muted);margin-top:8px}
h2{font-size:11px;margin:0 0 14px;color:var(--accent2)}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel{
  background:var(--panel);padding:18px;position:relative;margin:4px;
  box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line),inset 0 4px 0 0 var(--hi),inset 0 -4px 0 0 var(--lo);
  transition:background-color .6s;
}
.btn,select,input{font:inherit;color:inherit}
.btn{
  background:var(--accent);color:var(--accent-ink);border:0;padding:12px 14px;cursor:pointer;position:relative;margin:4px;
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line),inset 0 -3px 0 0 rgba(0,0,0,.25),inset 0 3px 0 0 rgba(255,255,255,.3);
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px)}
.btn.ghost{background:var(--lo);color:var(--ink)}
.btn.small{padding:8px 10px;font-size:8px}
.btn[hidden]{display:none}
.btn:focus-visible,select:focus-visible,input:focus-visible,.tab:focus-visible,.slot:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}
select,input[type=text],input[type=number]{
  background:var(--lo);border:0;padding:10px;width:100%;
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line);
}
select{width:auto;padding:8px 10px;font-size:9px;margin:3px}

<body data-season="fall">
<div class="wrap">

      <div class="btns">

        <button class="btn ghost" id="resetBtn">Reset</button>

      <p class="msg" id="msg" aria-live="polite"></p>
    </section>

    <section class="panel build" aria-label="Build area">

      <div class="stage" id="stage"><canvas id="scene" width="96" height="80" aria-label="Pixel art build. Tap it to say hello."></canvas></div>

    </section>
  </main>

  <section class="stats" aria-label="Tally">

    <div class="panel stat"><div class="l">Builds done</div><div class="v" id="stBuilds">0</div><div class="s">&nbsp;</div></div>
    <div class="panel stat" title="One rest day in a row never breaks it."><div class="l">Gentle streak</div><div class="v" id="stStreak">-</div><div class="s" id="stStreakNote"></div></div>
  </section>

  <section class="panel week-wrap" aria-label="Last 14 days">

  </section>

    <div class="shelf" id="shelf"></div>
  </section>

    </div>
    <div class="checks">

      <label><input type="checkbox" id="cIdeas"> Gentle break ideas</label>

    </div>
    <div class="row">

  <p class="foot">Missed a session? Nothing is lost. The next one picks up right where you left off.<br>Everything is saved on this device. Tap the creature to say hi.</p>
</div>

  document.querySelectorAll('.tab').forEach(el => el.setAttribute('aria-selected', el.dataset.mode === t.mode));
  renderTime();
  $('#modeline').textContent = MODE_LABEL[t.mode];
  const dots = $('#dots'); dots.innerHTML = '';
  for (let i = 0; i < S.settings.every; i++) { const d = document.createElement('div'); d.className = 'dot' + ((t.mode === 'long' || i < S.cycle) ? ' on' : ''); dots.appendChild(d); }
  const full = !t.running && !isPartial();
  $('#startBtn').textContent = t.running ? 'Pause' : (full ? 'Start' : 'Resume');
  $('#skipBtn').hidden = t.mode === 'focus';
  $('#buildName').textContent = (b.rare ? '* ' : '') + TITLES[s][b.type];
  $('#buildProg').textContent = `${b.n} / ${total}`;
  const chips = $('#chips'); chips.innerHTML = '';
  pcs.forEach((p, i) => { const c = document.createElement('span'); c.className = 'chip' + (i < b.n ? ' on' : ''); c.textContent = p.name; chips.appendChild(c); });
  $('#hint').textContent = b.done ? 'Finished! It lives on the shelf now. Your next focus session starts a fresh one.' : `Next piece: ${pcs[b.n].name}`;
  $('#stToday').textContent = S.today.count;
  $('#stBuilds').textContent = S.collection.length;
  const k = dayKey(), alive = S.streak.last && dayDiff(S.streak.last, k) <= 2 ? S.streak.count : 0;
  $('#stStreak').textContent = alive ? `${alive} day${alive > 1 ? 's' : ''}` : '-';
  $('#stStreakNote').textContent = alive ? (S.streak.last === k ? 'Nice work today' : 'Today is still open') : (S.streak.best ? 'A fresh start awaits' : 'Begin any time');
  $('#seasonSel').value = S.settings.season;
  $('#muteBtn').textContent = `Sound: ${S.settings.mute ? 'Off' : 'On'}`;
  $('#muteBtn').setAttribute('aria-pressed', S.settings.mute);
  renderStatus(); ambSync();
}
function renderWeek() {
  const el = $('#week'); el.innerHTML = ''; const base = new Date(); base.setHours(12, 0, 0, 0);
  for (let i = 13; i >= 0; i--) {
    const d = new Date(base.getTime() - i * 864e5), k = dayKey(d), n = S.days[k] || 0;
    const cell = document.createElement('div'); cell.className = 'wcell' + (i === 0 ? ' today' : '');
    const dd = document.createElement('div'); dd.className = 'wd ' + (n === 0 ? '' : n === 1 ? 'l1' : n < 4 ? 'l2' : 'l3'); dd.title = `${k}: ${n} session${n === 1 ? '' : 's'}`;
    cell.append(dd, document.createTextNode('SMTWTFS'[d.getDay()])); el.appendChild(cell);
  }
}
function savePng(item) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const old = cx; cx = c.getContext('2d'); cx.imageSmoothingEnabled = false;
  scene(item.season, item.type || 0, PIECES[item.season][item.type || 0].length, true, 3.2, false, -1, 1, false, item.rare);
  cx = old;
  const o = document.createElement('canvas'); o.width = W * 8; o.height = H * 8;
  const ox = o.getContext('2d'); ox.imageSmoothingEnabled = false; ox.drawImage(c, 0, 0, o.width, o.height);
  o.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `pomo-patch-${item.season}-${item.date}.png`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); });
}
function renderShelf() {
  const el = $('#shelf'); el.innerHTML = '';
  if (!S.collection.length) { el.innerHTML = '<div class="empty">Finished builds will rest here. Complete one to set it on the shelf.</div>'; return; }
  S.collection.slice(0, 60).forEach(item => {
    const type = item.type || 0, slot = document.createElement('div'); slot.className = 'slot'; slot.tabIndex = 0; slot.setAttribute('role', 'button');
    const fig = document.createElement('div'); fig.className = 'fig';
    const c = document.createElement('canvas'); c.width = W; c.height = 70;
    const old = cx; cx = c.getContext('2d'); cx.imageSmoothingEnabled = false;
    scene(item.season, type, PIECES[item.season][type].length, true, 3.17 + (item.id % 7), false, -1, 1, true, item.rare);
    cx = old; fig.appendChild(c);
    const plank = document.createElement('div'); plank.className = 'plank';
    const cap = document.createElement('div'); cap.className = 'cap';
    cap.innerHTML = `<b></b><br><span></span>`; cap.querySelector('b').textContent = (item.rare ? '* ' : '') + TITLES[item.season][type]; cap.querySelector('span').textContent = item.date;
    const det = document.createElement('div'); det.className = 'det';
    const counts = new Map(); (item.tasks || []).forEach(x => counts.set(x, (counts.get(x) || 0) + 1));
    if (counts.size) { const ul = document.createElement('ul'); counts.forEach((n, x) => { const li = document.createElement('li'); li.textContent = n > 1 ? `${x} (x${n})` : x; ul.appendChild(li); }); det.append('Built during:', ul); }
    else det.append('No task names saved for this one.', document.createElement('br'));
    const btn = document.createElement('button'); btn.className = 'btn small'; btn.textContent = 'Save PNG';
    btn.addEventListener('click', e => { e.stopPropagation(); savePng(item); }); det.appendChild(btn);
    slot.append(fig, plank, cap, det); el.appendChild(slot);
    const toggle = () => slot.classList.toggle('open');
    slot.addEventListener('click', toggle);
    slot.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === slot) { e.preventDefault(); toggle(); } });
  });
}

/* ---------- main loop ---------- */
let lastDraw = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (now - lastDraw < 80) return; lastDraw = now;
  const s = season(), b = S.builds[s], t = now / 1000, brk = S.timer.mode !== 'focus';
  let pi = -1, pk = 1;
  if (popS && popS.season === s) { pk = Math.min(1, (performance.now() - popS.t0) / 700); pi = popS.idx; if (pk >= 1) popS = null; }
  REACT = reactT0 && performance.now() - reactT0 < 900 ? (performance.now() - reactT0) / 900 : -1;
  scene(s, b.type, b.n, b.done, t, brk, pi, pk, false, b.rare);
  REACT = -1;
  drawSparkles(performance.now());
  if (flash.until && flash.until < Date.now()) { flash.until = 0; renderStatus(); }
}
function fit() {
  const w = $('#stage').clientWidth - 8, sc = Math.max(1, Math.floor(Math.min(w, 720) / W));
  cv.style.width = W * sc + 'px'; cv.style.height = H * sc + 'px';
}
if (window.ResizeObserver) new ResizeObserver(fit).observe($('#stage')); window.addEventListener('resize', fit);

/* ---------- events ---------- */
document.querySelectorAll('.tab').forEach(el => el.addEventListener('click', () => { if (el.dataset.mode !== S.timer.mode || S.timer.running) setMode(el.dataset.mode); }));
$('#startBtn').addEventListener('click', () => S.timer.running ? pauseTimer() : startTimer());
$('#resetBtn').addEventListener('click', resetTimer);
$('#plusBtn').addEventListener('click', addFive);
$('#skipBtn').addEventListener('click', () => setMode('focus'));
cv.addEventListener('pointerdown', e => {
  ensureAudio();
  const r = cv.getBoundingClientRect();
  reactT0 = performance.now(); sparkle((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H, 6); tone(660, 0, .12, .04, 'triangle');
});
$('#task').value = S.task;
$('#task').addEventListener('input', e => { S.task = e.target.value; save(); renderStatus(); });
$('#seasonSel').addEventListener('change', e => { S.settings.season = e.target.value; save(); renderAll(); });
$('#muteBtn').addEventListener('click', () => { S.settings.mute = !S.settings.mute; ensureAudio(); save(); renderAll(); });
$('#gearBtn').addEventListener('click', () => { const p = $('#settings'); p.hidden = !p.hidden; $('#gearBtn').setAttribute('aria-expanded', !p.hidden); if (!p.hidden) p.scrollIntoView({behavior: 'smooth', block: 'nearest'}); });
[['sFocus', 'focus', 0.05, 180], ['sShort', 'short', 0.05, 60], ['sLong', 'long', 0.05, 120], ['sEvery', 'every', 2, 12]].forEach(([id, key, lo, hi]) => {
  const el = $('#' + id); el.value = S.settings[key];
  el.addEventListener('change', () => {
    S.settings[key] = key === 'every' ? Math.round(clampNum(el.value, lo, hi, S.settings[key])) : clampNum(el.value, lo, hi, S.settings[key]);
    el.value = S.settings[key]; save(); renderAll();
  });
});
[['cAmbient', 'ambient'], ['cIdeas', 'ideas'], ['cAutoBreak', 'autoBreak'], ['cAutoFocus', 'autoFocus']].forEach(([id, key]) => {
  const el = $('#' + id); el.checked = !!S.settings[key];
  el.addEventListener('change', () => { S.settings[key] = el.checked; if (key === 'ambient') ensureAudio(); save(); renderAll(); });
});
{
  const el = $('#cNotify'); el.checked = !!S.settings.notify && 'Notification' in window && Notification.permission === 'granted';
  if (!('Notification' in window)) el.disabled = true;
  el.addEventListener('change', () => {
    S.settings.notify = el.checked; save();
    if (el.checked && Notification.permission !== 'granted') Notification.requestPermission().then(p => { if (p !== 'granted') { S.settings.notify = false; el.checked = false; save(); } });
  });
}
$('#exportBtn').addEventListener('click', () => {
  const b = new Blob([JSON.stringify(S, null, 2)], {type: 'application/json'}), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = `pomo-patch-${dayKey()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd_ = new FileReader();
  rd_.onload = () => {
    try {
      const o = JSON.parse(rd_.result);
      if (!o || typeof o !== 'object' || !o.settings || !o.builds) throw new Error('bad');
      if (!confirm('Replace your current progress with this save file?')) return;
      localStorage.setItem(KEY, JSON.stringify(o)); location.reload();
    } catch (err) { msgFlash('That file does not look like a Pomo Patch save.'); }
  };
  rd_.readAsText(f); e.target.value = '';
});
$('#wipeBtn').addEventListener('click', () => {
  if (confirm('Clear all progress, settings and your collection on this device?')) { try { localStorage.removeItem(KEY); } catch (e) {} S = defaults(); location.reload(); }
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !/INPUT|SELECT|TEXTAREA|BUTTON/.test(document.activeElement.tagName) && !document.activeElement.classList.contains('slot')) { e.preventDefault(); S.timer.running ? pauseTimer() : startTimer(); }
});

/* ---------- boot ---------- */
if (S.timer.running && S.timer.endAt <= Date.now()) { completeTimer(); msgFlash('Welcome back! Your session finished while you were away.', 14000); }
renderAll(); renderShelf(); renderWeek(); fit();
requestAnimationFrame(frame);
window.__cozy = {get S() { return S; }, complete: completeTimer, save, renderAll, renderShelf, renderWeek, newBuild};
})();
</script>
