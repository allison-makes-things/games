<!doctype html>
<html lang="en" data-season="autumn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e9c89b">
<title>Acorn &amp; Crumb</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌰%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" id="touchIcon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2a24;--bg:#e9c89b;--panel:#fff3de;--panel2:#f3dfbd;--accent:#d9702f;--work:#d98a3a;--home:#5f9c5a;--care:#e0709a;}
html[data-season=spring]{--bg:#cfe9c8;--panel:#fff7ea;--panel2:#f6e6d2;--accent:#e9799b}
html[data-season=summer]{--bg:#bfe6f0;--panel:#fffaf0;--panel2:#f7ecd0;--accent:#e8962a}
html[data-season=autumn]{--bg:#e9c89b;--panel:#fff3de;--panel2:#f3dfbd;--accent:#d9702f}
html[data-season=winter]{--bg:#c9d6ea;--panel:#f7f9ff;--panel2:#e3e9f5;--accent:#5f93cf}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background-color:var(--bg);
  background-image:linear-gradient(45deg,rgba(255,255,255,.14) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.14) 75%),
                   linear-gradient(45deg,rgba(255,255,255,.14) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.14) 75%);
  background-size:32px 32px;background-position:0 0,16px 16px;
  font-family:'VT323',ui-monospace,monospace;font-size:22px;line-height:1.15;-webkit-text-size-adjust:100%}
button,input,select{touch-action:manipulation}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1,h2{font-family:'Press Start 2P',ui-monospace,monospace;margin:0;font-weight:400}
h1{font-size:clamp(14px,3.2vw,22px);line-height:1.4}
h2{font-size:14px;margin-bottom:12px}
h3.sub{font-family:'Press Start 2P',monospace;font-weight:400;font-size:11px;margin:16px 0 10px}
.panel{background:var(--panel);border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink),inset 0 0 0 3px var(--panel2);padding:16px}
.btn{font:inherit;font-size:20px;color:#fff;background:var(--accent);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:6px 14px;cursor:pointer;text-shadow:1px 1px 0 rgba(0,0,0,.3)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.btn[disabled]{background:#b9aa98;cursor:not-allowed;filter:none;text-shadow:none;color:#6b5d50}
.btn.ghost{background:var(--panel);color:var(--ink);text-shadow:none}
.btn.small{font-size:18px;padding:3px 10px}
/* settings dropdown */
details.settings{position:relative}
details.settings summary{list-style:none;display:inline-block}
details.settings summary::-webkit-details-marker{display:none}
.setbox{position:absolute;right:0;top:calc(100% + 10px);z-index:6;width:min(330px,92vw);display:grid;gap:10px}
.setrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.setrow label{display:flex;gap:8px;align-items:center;flex:1}
input[type=range]{flex:1;accent-color:var(--accent)}
main{display:grid;gap:20px;grid-template-columns:1.25fr 1fr;grid-template-areas:"cafe todo" "shop todo" "reg todo";align-items:start}
.cafe{grid-area:cafe}.todo{grid-area:todo}.regulars{grid-area:reg}.shop{grid-area:shop}
@media (max-width:820px){
  main{grid-template-columns:1fr;grid-template-areas:"cafe" "todo" "shop" "reg"}
  .wrap{padding:10px}.panel{padding:12px}
  .btn{min-height:44px}.btn.small{min-height:40px}
  .task{padding:10px 8px}.task .box{width:28px;height:28px}.task input{width:28px;height:28px}
  .dish{min-height:84px}
  body{font-size:21px}
}
.stage{position:relative;border:4px solid var(--ink);background:#000;line-height:0}
canvas#scene{width:100%;height:auto;image-rendering:pixelated;display:block}
.bubble{position:absolute;left:52%;top:3%;max-width:44%;background:#fffdf6;border:3px solid var(--ink);padding:6px 10px;
  display:flex;gap:8px;align-items:center;line-height:1.05;font-size:clamp(14px,2.4vw,21px);transition:opacity .2s}
.bubble::before{content:"";position:absolute;left:-12px;bottom:10px;border:6px solid transparent;border-right:8px solid var(--ink)}
.bubble::after{content:"";position:absolute;left:-7px;bottom:12px;border:4px solid transparent;border-right:6px solid #fffdf6}
.bubble.hidden{opacity:0}
.bubble .tag,.tag{display:inline-block;background:var(--accent);color:#fff;padding:0 6px;font-size:.8em}
.event{margin-top:12px;background:var(--accent);color:#fff;border:3px solid var(--ink);padding:4px 10px;text-shadow:1px 1px 0 rgba(0,0,0,.3)}
.serve-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-top:16px}
.pantry{display:flex;flex-direction:column;gap:6px}
.pips{display:flex;gap:6px}
.pip{width:26px;height:26px;border:3px solid var(--ink);background:#fff;opacity:.55}
.pip.on{opacity:1;box-shadow:inset -4px -4px 0 rgba(0,0,0,.18),inset 3px 3px 0 rgba(255,255,255,.35)}
.stats{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px 18px;opacity:.9}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.dish{position:relative;font:inherit;font-size:18px;line-height:1.05;color:var(--ink);background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.dish img{width:48px;height:40px;image-rendering:pixelated}
.dish .dot{position:absolute;top:5px;right:5px;width:10px;height:10px;border:2px solid var(--ink)}
.dish:hover:not([disabled]){background:var(--panel2)}
.dish:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.dish:focus-visible{outline:3px dashed var(--accent);outline-offset:3px}
.dish[disabled]{opacity:.5;cursor:not-allowed}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 0;font-size:18px;opacity:.85}
.legend i{display:inline-block;width:10px;height:10px;border:2px solid var(--ink);margin-right:4px}
/* tasks */
form#addForm{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.addrow{display:flex;gap:10px}
.optrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],select{font:inherit;font-size:20px;padding:5px 8px;border:3px solid var(--ink);background:#fff;color:var(--ink)}
input[type=text]{flex:1;min-width:0;font-size:22px;padding:6px 10px}
.optrow label{display:flex;align-items:center;gap:6px;font-size:19px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{font:inherit;font-size:18px;padding:2px 12px;border:3px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff}
ul#taskList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);padding:6px 8px}
.task.dragging{opacity:.6;outline:3px dashed var(--accent)}
.task .grip{border:none;background:none;font:inherit;font-size:22px;cursor:grab;color:var(--ink);opacity:.45;padding:0 4px;touch-action:none}
.task label{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;min-width:0;position:relative}
.task input{position:absolute;opacity:0;width:24px;height:24px;margin:0}
.task .box{width:24px;height:24px;border:3px solid var(--ink);background:#fff;flex:none;display:grid;place-items:center;color:#fff;font-size:20px}
.task input:checked+.box{background:var(--accent)}
.task input:checked+.box::after{content:"✔"}
.task input:focus-visible+.box{outline:3px dashed var(--accent);outline-offset:2px}
.task .txt{overflow-wrap:anywhere}
.task .badge{display:inline-block;width:10px;height:10px;border:2px solid var(--ink);margin-right:6px;vertical-align:middle}
.task .meta{opacity:.7;font-size:17px;margin-left:6px;white-space:nowrap}
.task.done .txt{text-decoration:line-through;opacity:.5}
.task .del{background:none;border:none;font:inherit;font-size:24px;color:var(--ink);cursor:pointer;opacity:.5;padding:0 6px}
.task .del:hover{opacity:1}
.todo-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
.empty{opacity:.7;padding:10px 4px}
/* guestbook + shop */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.card{font:inherit;color:inherit;background:#fff;border:3px solid var(--ink);padding:8px;text-align:center;font-size:19px;cursor:pointer;display:block;width:100%}
.card.locked{cursor:default}
.card:hover:not(.locked){background:var(--panel2)}
.card img.sp{width:72px;height:72px;image-rendering:pixelated}
.card.locked img.sp{filter:brightness(0);opacity:.2}
.card .nm{font-family:'Press Start 2P',monospace;font-size:10px;margin:4px 0}
.card .loves{display:flex;gap:4px;align-items:center;justify-content:center;font-size:17px;opacity:.85}
.card .loves img{width:24px;height:20px;image-rendering:pixelated}
.hearts{color:#e8587a}
.up{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff;border:3px solid var(--ink);padding:8px 10px;margin-bottom:8px}
.up .nm{font-family:'Press Start 2P',monospace;font-size:10px;margin-bottom:4px}
.up .ds{opacity:.8;font-size:19px}
.up.owned{opacity:.65}
.up .btn{flex:none;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,120px);transition:transform .25s;background:var(--panel);border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:8px 16px;z-index:12;max-width:92vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
#overlay{position:fixed;inset:0;background:rgba(40,25,20,.55);display:grid;place-items:center;z-index:10;padding:16px}
#overlay[hidden]{display:none}
#overlay .panel{max-width:420px;width:100%;max-height:92vh;overflow:auto;text-align:center}
#overlay img#ovImg{width:120px;height:120px;image-rendering:pixelated}
#overlay .kicker{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--accent);margin-bottom:8px}
#overlay h3{font-family:'Press Start 2P',monospace;font-size:15px;margin:8px 0}
#ovBody{text-align:left;margin:10px 0}
#ovBody p{margin:0 0 8px}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:6px}
.mem div{display:flex;gap:6px;align-items:center;font-size:17px;background:#fff;border:2px solid var(--ink);padding:3px 5px}
.mem img{width:24px;height:20px;image-rendering:pixelated}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌰 Acorn &amp; Crumb</h1>
    <details class="settings">
      <summary class="btn ghost small">⚙ Settings</summary>
      <div class="setbox panel">
        <div class="setrow">
          <button class="btn ghost small" id="soundBtn"></button>
          <button class="btn ghost small" id="musicBtn"></button>
        </div>
        <div class="setrow"><label>Volume <input type="range" id="volume" min="0" max="100" aria-label="Volume"></label></div>
        <div class="setrow">
          <button class="btn ghost small" id="seasonBtn" title="Change the season"></button>
          <button class="btn ghost small" id="timeBtn" title="Change the time of day"></button>
        </div>
        <div class="setrow">
          <button class="btn ghost small" id="exportBtn">Save backup</button>
          <button class="btn ghost small" id="importBtn">Load backup</button>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
        </div>
        <div class="setrow"><button class="btn ghost small" id="resetBtn">Start over</button></div>
      </div>
    </details>
  </header>

  <main>
    <section class="cafe panel" aria-label="The café">
      <div class="stage">
        <canvas id="scene" width="320" height="176" role="img" aria-label="A cozy café counter with an animal customer waiting"></canvas>
        <div class="bubble hidden" id="bubble" aria-live="polite"></div>
      </div>
      <div class="event" id="eventBanner" hidden></div>
      <div class="serve-row">
        <div class="pantry">
          <div class="pips" id="pips" aria-hidden="true"></div>
          <div id="pantryTxt"></div>
        </div>
      </div>
      <div id="menuHint" style="margin:14px 0 8px"></div>
      <div class="menu" id="menu"></div>
      <div class="legend" id="legend"></div>
      <div class="stats" id="stats"></div>
    </section>

    <section class="todo panel" aria-label="Tasks">
      <h2>Today's tasks</h2>
      <form id="addForm">
        <div class="addrow">
          <input type="text" id="taskInput" placeholder="What needs doing?" maxlength="120" autocomplete="off" aria-label="New task">
          <button class="btn">Add</button>
        </div>
        <div class="optrow">
          <select id="taskCat" aria-label="Category"><option value="work">Work</option><option value="home">Home</option><option value="care">Self-care</option></select>
          <select id="taskRepeat" aria-label="Repeat"><option value="">Once</option><option value="daily">Daily</option><option value="weekly">Weekly</option></select>
          <label><input type="checkbox" id="taskBig"> Big task (x2)</label>
        </div>
      </form>
      <div class="tabs" id="tabs" role="tablist"></div>
      <ul id="taskList"></ul>
      <div class="todo-foot">
        <span id="leftTxt"></span>
        <button class="btn ghost small" id="clearBtn">Clear done</button>
      </div>
    </section>

    <section class="shop panel" aria-label="Café upgrades">
      <h2>Café upgrades</h2>
      <p id="walletTxt" style="margin:0 0 12px"></p>
      <div id="shopList"></div>
      <h3 class="sub">Menu additions</h3>
      <div id="menuShop"></div>
    </section>

    <section class="regulars panel" aria-label="Regulars">
      <h2>Regulars</h2>
      <p id="nextHint" style="margin:0 0 12px"></p>
      <div class="grid" id="guestbook"></div>
      <h3 class="sub">Rare visitors</h3>
      <div class="grid" id="rareBook"></div>
    </section>
  </main>
</div>

<div id="toast" role="status"></div>
<div id="overlay" hidden>
  <div class="panel" role="dialog" aria-modal="true">
    <div class="kicker" id="ovKicker"></div>
    <img id="ovImg" alt="">
    <h3 id="ovName"></h3>
    <div id="ovBody"></div>
    <button class="btn" id="ovBtn">OK</button>
  </div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);

/* ---------- tuning ---------- */
const TASKS_PER_ORDER = 3;     // ingredients needed to cook one order
const ORDERS_PER_REGULAR = 3;  // orders served before a new regular arrives
const LEVELS = [5, 10, 20];    // hearts with one animal for friendship levels 1-3
const KEY = 'cozy-cafe-v1';

/* ---------- dishes ---------- */
const DISH_ROWS = {
  cookie:['............','....kkkk....','..kkbbbbkk..','.kbbbBbbbbk.','.kbBbbbbbBk.','.kbbbbBbbbk.','.kbbBbbbbbk.','..kkbbbbkk..','....kkkk....','............'],
  tea:['...s..s.....','....s..s....','............','.kkkkkkkk...','.kwwwwwwkkk.','.kcccccckwk.','.kcccccckwk.','.kcccccckk..','..kccccck...','...kkkkk....'],
  cake:['............','.....rr.....','..kkkkkkkk..','.kppppppppk.','.kwwwwwwwwk.','.kbbbbbbbbk.','.kwwwwwwwwk.','.kbbbbbbbbk.','..kkkkkkkk..','............'],
  soup:['...s...s....','....s...s...','............','..kkkkkkkk..','.kbbggbbbbk.','kkkkkkkkkkkk','kcccccccccck','.kcccccccck.','..kcccccck..','...kkkkkk...'],
  muffin:['............','....kkkk....','..kkbbbbkk..','.kbbbubbbbk.','.kbubbbbbbk.','.kkkkkkkkkk.','..kyyyyyyk..','..kyywyyyk..','..kyyyyyyk..','...kkkkkk...'],
  tart:['............','............','....rr......','..kkkkkkkk..','.krrprrrrrk.','.krrrrrprrk.','.kbbbbbbbbk.','..kbbbbbbk..','...kkkkkk...','............'],
  toast:['............','..kkkkkkkk..','.kyyyyyyyyk.','kyyooyyyoyyk','kyyyyoyyyyyk','kbyyyyyyyybk','.kbbbbbbbbk.','..kkkkkkkk..','............','............'],
  scone:['............','....kkkk....','...kyyyyk...','..kyoyyyyk..','.kyyyyoyyyk.','.kbbbbbbbbk.','..kkkkkkkk..','............','............','............'],
  pop:['....kkkk....','...kppppk...','...kpprrk...','...krrrrk...','...krrrrk...','...kuuuuk...','...kuuuuk...','...kkkkkk...','.....kwk....','.....kwk....'],
  ginger:['....kkkk....','...kbbbbk...','...kbBbBk...','...kbbbbk...','.kkbbwwbbkk.','.kbbbbbbbbk.','.kkkbbbbkkk.','...kbbbbk...','...kbkkbk...','...kkkkkk...'],
  roll:['............','...kkkkkk...','..kwwwwwwk..','.kwbbbbbbwk.','.kwbwwwwbwk.','.kwbwBBwbwk.','.kwbwwwwbwk.','.kwbbbbbbwk.','..kwwwwwwk..','...kkkkkk...'],
  pancake:['............','.....yy.....','..kkkkkkkk..','.kooyooooyk.','.kbbbbbbbbk.','.kyyyyyyyyk.','.kbbbbbbbbk.','.kyyyyyyyyk.','..kkkkkkkk..','............']
};
const DISH_PAL = {k:'#3b2a24',w:'#fff4e0',b:'#b9733f',B:'#6b4026',r:'#d9534f',p:'#f4a6b8',y:'#f5d061',o:'#e8923a',g:'#7fb069',c:'#79b4d6',s:'rgba(255,255,255,.75)',u:'#5b6fd1'};
// cat: which ingredient type matches (work = brew, home = comfort, care = sweet). The first 7 keep their positions: saves refer to dishes by index.
const DISHES = [
  {name:'Acorn Cookie',rows:'cookie',cat:'care'},
  {name:'Moonlit Tea',rows:'tea',cat:'work'},
  {name:'Strawberry Cake',rows:'cake',cat:'care'},
  {name:'Mushroom Soup',rows:'soup',cat:'home'},
  {name:'Blueberry Muffin',rows:'muffin',cat:'home'},
  {name:'Berry Tart',rows:'tart',cat:'care'},
  {name:'Honey Toast',rows:'toast',cat:'home'},
  {name:'Honey Scone',rows:'scone',cat:'home',season:'spring'},
  {name:'Strawberry Shortcake',rows:'cake',cat:'care',season:'spring',pal:{p:'#fff4e0',w:'#e8574f',b:'#f0d29a'}},
  {name:'Peach Iced Tea',rows:'tea',cat:'work',season:'summer',pal:{c:'#f4a367',s:'rgba(0,0,0,0)'}},
  {name:'Berry Popsicle',rows:'pop',cat:'care',season:'summer'},
  {name:'Pumpkin Spice Latte',rows:'tea',cat:'work',season:'autumn',pal:{c:'#e8923a'}},
  {name:'Apple Crumble',rows:'tart',cat:'home',season:'autumn',pal:{r:'#e8c36a',p:'#d9a05a'}},
  {name:'Hot Cocoa',rows:'tea',cat:'work',season:'winter',pal:{c:'#6b4026'}},
  {name:'Gingerbread Cookie',rows:'ginger',cat:'care',season:'winter'},
  {name:'Mushroom Pie',rows:'tart',cat:'home',unlock:'pie',cost:10,pal:{r:'#a8693a',p:'#e8c9a0'}},
  {name:'Cinnamon Roll',rows:'roll',cat:'home',unlock:'roll',cost:12},
  {name:'Nut Butter Toast',rows:'toast',cat:'home',unlock:'nut',cost:10,pal:{o:'#8a5a3b',y:'#e8c98a'}},
  {name:'Pancake Stack',rows:'pancake',cat:'home',unlock:'pancake',cost:14}
];
const CATS = {
  work:{label:'Work',dishes:'brew',color:'#d98a3a'},
  home:{label:'Home',dishes:'comfort',color:'#5f9c5a'},
  care:{label:'Self-care',dishes:'sweet',color:'#e0709a'}
};
function dishCanvas(d){
  const rows=DISH_ROWS[d.rows],pal=Object.assign({},DISH_PAL,d.pal),c=document.createElement('canvas');c.width=12;c.height=10;
  const x=c.getContext('2d');
  rows.forEach((r,j)=>[...r.padEnd(12,'.')].forEach((ch,i)=>{if(ch!=='.'){x.fillStyle=pal[ch];x.fillRect(i,j,1,1);}}));
  return c;
}
const DISH_CV = DISHES.map(dishCanvas);
const DISH_URL = DISH_CV.map(c=>c.toDataURL());

/* ---------- animals ---------- */
const NORMAL = 8; // the first 8 arrive in order; the rest are rare visitors
const DISLIKE = ["Hm. Not really my thing... but thank you!","*polite nibble* ...interesting.","I can tell you tried. That counts!"];
const ANIMALS = [
  {name:'Clover',kind:'bunny',fav:4,dis:3,cloth:'#e86f8a',hello:'Hop hop! Is this the café everyone whispers about?',line:'So warm and fluffy. Thank you!',favLine:'My absolute favorite! *happy thumping*',
   stories:['Clover keeps a tiny garden behind the old oak. She says the carrots listen if you sing.','Clover once hopped three valleys to find the perfect clover patch. She is still not sure it was the right one.','Clover whispers that the café is her favorite place in the whole forest.']},
  {name:'Rusty',kind:'fox',fav:0,dis:1,cloth:'#3f7ca8',hello:'Smells like cookies in here. I might become a regular.',line:'Delicious. Clever cooking!',favLine:'Acorn cookies! You know me too well.',
   stories:['Rusty says he is a retired blueberry thief. Mostly retired.','He collects shiny acorn caps and trades them for stories.','Rusty admits the café is the first place that ever felt like a den.']},

let actx=null,master=null;
function audio(){
  if(state.muted)return null;
  try{
    if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();master=actx.createGain();master.connect(actx.destination);}
    master.gain.value=state.volume/100;
    if(actx.state==='suspended')actx.resume();
    return actx;
  }catch(e){return null;}
}
function tone(f,d,type='square',v=.05,delay=0,slideTo){
  const a=audio();if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(f,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(master);o.start(t);o.stop(t+d+.03);
}

  for(let j=0;j<16;j++)for(let i=0;i<16;i++){
    if(!g[j][i])continue;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=i+dx,ny=j+dy;
      if(nx<0||ny<0||nx>15||ny>15||!g[ny][nx])x.fillRect(nx+1,ny+1,1,1);
    }
  }
  for(let j=0;j<16;j++)for(let i=0;i<16;i++)if(g[j][i]){x.fillStyle=g[j][i];x.fillRect(i+1,j+1,1,1);}

}

function updateParticles(dt,ts){

/* ---------- customer flow ---------- */
let forceNext=null;
function pickRare(){
  const s=curSeason(),t=tod();
  const ok=[];
  for(let i=NORMAL;i<ANIMALS.length;i++){
    const r=ANIMALS[i].rare;
    if(r.night&&t!=='night')continue;
    if(r.season&&r.season!==s)continue;
    ok.push(i);
  }
  return ok.length&&Math.random()<.15?ok[Math.floor(Math.random()*ok.length)]:null;
}
function newCustomer(force){
  let a=force;
  if(a==null){
    const pool=[];for(let i=0;i<state.unlocked;i++)if(!state.customer||i!==state.customer.animal)pool.push(i);
    a=pool.length?pool[Math.floor(Math.random()*pool.length)]:0;
  }
  state.customer={animal:a};
}
function resumeFlow(){
  newCustomer(forceNext);forceNext=null;save();setPhase('in');sfx('bell');renderAll();
}
function updatePhase(ts){
  const el=ts-stage.t0;
  if(stage.phase==='in'&&el>700)setPhase('waiting');
  else if(stage.phase==='eat'&&el>2400)setPhase('out');
  else if(stage.phase==='out'&&el>700){
    if(state.queue.length){setPhase('gap');nextModal();return;}
    const r=pickRare();
    if(r!=null){
      if(!state.rareMet.includes(r)){state.rareMet.push(r);state.queue.push({type:'rare',a:r});save();setPhase('gap');nextModal();return;}
      forceNext=r;
    }
    resumeFlow();
  }
}
let last=performance.now();
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  updatePhase(ts);updateParticles(dt,ts);drawScene(ts);requestAnimationFrame(frame);
}

/* ---------- game logic ---------- */
function addIngredients(cat,n){
  for(let k=0;k<n;k++){
    state.basket.push(cat);
    if(state.basket.length>=TASKS_PER_ORDER){
      const batch=state.basket.splice(0,TASKS_PER_ORDER),counts={};
      batch.forEach(c=>counts[c]=(counts[c]||0)+1);
      const max=Math.max(...Object.values(counts));
      const maj=[...batch].reverse().find(c=>counts[c]===max);
      state.orders.push(maj);
      sfx('order');toast('Order up! Mostly '+CATS[maj].label+' ingredients, so '+CATS[maj].dishes+' dishes get a bonus.');
    }else sfx('check');
  }
}
function bumpStreak(){
  const td=todayStr(),s=state.streak;
  if(s.last===td)return;
  s.count=s.last===yesterdayStr()?s.count+1:1;s.last=td;
  const bonus={3:5,7:10,14:20,30:40}[s.count];
  if(bonus){state.wallet+=bonus;setTimeout(()=>{toast(s.count+'-day streak! +'+bonus+' ♥');sfx('arrive');},900);}
}
function toggleTask(id,checked){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  t.done=checked;
  if(!checked)sfx('uncheck');
  else if(!t.credited){
    t.credited=true;t.doneOn=todayStr();state.completed++;
    const before=state.orders.length;
    addIngredients(t.cat,t.big?2:1);
    if(state.orders.length===before)toast('Ingredient gathered ('+state.basket.length+'/'+TASKS_PER_ORDER+')');
    bumpStreak();
  }else{t.doneOn=t.doneOn||todayStr();sfx('check');}
  save();renderAll();
}
function refreshRecurring(){
  const td=todayStr();let ch=false;
  state.tasks.forEach(t=>{
    if(t.repeat&&t.done&&t.doneOn){
      const d=daysBetween(t.doneOn,td);
      if((t.repeat==='daily'&&d>=1)||(t.repeat==='weekly'&&d>=7)){t.done=false;t.credited=false;ch=true;}
    }
  });
  if(ch){save();renderTasks();renderStats();}
}
function serve(dish){
  if(!state.orders.length||stage.phase!=='waiting')return;
  const c=state.customer,an=ANIMALS[c.animal],d=DISHES[dish];
  const fav=dish===an.fav,dis=dish===an.dis,orderCat=state.orders.shift();
  const tried=state.tried[c.animal]||(state.tried[c.animal]=[]);
  stage.disc=fav&&!tried.includes(dish);stage.dish=dish;
  if(!tried.includes(dish))tried.push(dish);
  const notes=[];let gain=1,aff=0;
  if(!dis){
    aff=fav?2:1;gain=aff;
    if(orderCat===d.cat){gain++;notes.push('fresh match');}
    if(has('tip')){gain++;notes.push('tip');}
    const ev=eventNow();if(ev&&!ev.preview){gain++;notes.push(ev.e.name);}
  }
  const before=lvl(state.hearts[c.animal]||0);
  state.hearts[c.animal]=(state.hearts[c.animal]||0)+aff;
  for(let L=before+1;L<=lvl(state.hearts[c.animal]);L++){
    state.queue.push({type:'story',a:c.animal,lvl:L});
    if(L===2&&!state.gifts.includes(c.animal))state.gifts.push(c.animal);
  }
  state.wallet+=gain;state.served++;
  stage.line=fav?an.favLine:dis?DISLIKE[Math.floor(Math.random()*DISLIKE.length)]:an.line;
  spawnHearts(fav?9:dis?1:5);sfx('serve');if(!dis)sfx('hearts');
  if(state.served%ORDERS_PER_REGULAR===0&&state.unlocked<NORMAL){state.unlocked++;state.queue.push({type:'arrival',a:state.unlocked-1});}
  toast(stage.disc?'You found '+an.name+"'s favorite! +"+gain+' ♥':dis?an.name+" wasn't a fan. +1 ♥":'+'+gain+' ♥'+(notes.length?' ('+notes.join(', ')+')':''));
  save();setPhase('eat');renderAll();
}
function buy(id){
  const u=UPGRADES.find(x=>x.id===id);
  if(!u||has(id)||state.wallet<u.cost){sfx('deny');return;}
  state.wallet-=u.cost;state.upgrades.push(id);sfx('buy');toast('Bought: '+u.name+'!');save();renderAll();
}
function buyDish(key){
  const d=DISHES.find(x=>x.unlock===key);
  if(!d||state.dishUnlocks.includes(key)||state.wallet<d.cost){sfx('deny');return;}
  state.wallet-=d.cost;state.dishUnlocks.push(key);sfx('buy');toast(d.name+' is now on the menu!');save();renderAll();
}

/* ---------- rendering ---------- */
let menuSig='';
function renderServe(){
  const av=availDishes(),sig=av.join(',');
  const m=$('#menu');
  if(sig!==menuSig){
    menuSig=sig;m.textContent='';
    av.forEach(i=>{
      const d=DISHES[i],b=document.createElement('button');b.className='dish';b.dataset.i=i;
      b.innerHTML='<i class="dot" style="background:'+CATS[d.cat].color+'"></i><img alt="" src="'+DISH_URL[i]+'"><span></span>';
      b.querySelector('span').textContent=d.name;b.onclick=()=>serve(i);m.append(b);
    });
  }
  const can=stage.phase==='waiting'&&state.orders.length>0,need=TASKS_PER_ORDER-state.basket.length;
  m.querySelectorAll('.dish').forEach(b=>b.disabled=!can);
  const oc=state.orders[0];
  $('#menuHint').textContent=can?(oc&&CATS[oc]?'This batch is mostly '+CATS[oc].label+': '+CATS[oc].dishes+' dishes earn a bonus. Which will they love?':'Pick something from the menu. Which will they love?')
    :stage.phase==='waiting'?'Finish '+need+' more ingredient'+(need===1?'':'s')+' to cook an order.':'';
  $('#legend').innerHTML=Object.values(CATS).map(c=>'<span><i style="background:'+c.color+'"></i>'+c.label+' = '+c.dishes+'</span>').join('');
}
function renderPantry(){
  $('#pips').innerHTML=Array.from({length:TASKS_PER_ORDER},(_,i)=>{
    const c=state.basket[i];return '<span class="pip'+(c?' on':'')+'"'+(c?' style="background:'+CATS[c].color+'"':'')+'></span>';
  }).join('');
  const n=state.orders.length;
  $('#pantryTxt').textContent=state.basket.length+'/'+TASKS_PER_ORDER+' ingredients · '+n+' order'+(n===1?'':'s')+' ready';
}
function renderBubble(){
  const b=$('#bubble'),c=state.customer;
  if(!c||stage.phase==='in'||stage.phase==='out'||stage.phase==='gap'){b.className='bubble hidden';return;}
  b.className='bubble';
  if(stage.phase==='waiting'){
    const an=ANIMALS[c.animal],n=(state.tried[c.animal]||[]).length;
    b.innerHTML='<span class="hearts">?</span><span>'+an.name+': "'+(n?'Back again! Surprise me.':"Hi! I'm new here. What would you recommend?")+'"</span>';
  }else{
    b.innerHTML='<span class="hearts">♥</span><span>'+ANIMALS[c.animal].name+': "'+stage.line+'"'+(stage.disc?' <span class="tag">favorite found!</span>':'')+'</span>';
  }
}
function renderEvent(){
  const ev=eventNow(),b=$('#eventBanner');
  if(!ev){b.hidden=true;return;}
  b.hidden=false;b.textContent=ev.e.name+(ev.preview?' (preview): bonus hearts only during the real dates.':': +1 ♥ on every order!');
}
function streakNow(){const s=state.streak;return s.last===todayStr()||s.last===yesterdayStr()?s.count:0;}
function renderStats(){
  const sn=streakNow();
  $('#stats').innerHTML='<span class="hearts">♥ '+state.wallet+'</span><span>Tasks done: '+state.completed+'</span><span>Orders served: '+state.served+'</span><span>Regulars: '+state.unlocked+'/'+NORMAL+'</span><span>Streak: '+sn+' day'+(sn===1?'':'s')+'</span>';
  const need=ORDERS_PER_REGULAR-state.served%ORDERS_PER_REGULAR;
  $('#nextHint').textContent=state.unlocked>=NORMAL?'The whole forest has found your café! Click a friend to read their story.':'Serve '+need+' more order'+(need===1?'':'s')+' and someone new will wander in. Click a friend to read their story.';
}
function renderShop(){
  $('#walletTxt').innerHTML='You have <span class="hearts">♥ '+state.wallet+'</span> to spend. Hearts come from serving customers.';
  const l=$('#shopList');l.textContent='';
  UPGRADES.forEach(u=>{
    const owned=has(u.id),d=document.createElement('div');d.className='up'+(owned?' owned':'');
    d.innerHTML='<div><div class="nm"></div><div class="ds"></div></div>';
    d.querySelector('.nm').textContent=u.name;d.querySelector('.ds').textContent=u.desc;
    const b=document.createElement('button');b.className='btn small';
    if(owned){b.textContent='Owned';b.disabled=true;}
    else{b.textContent='Buy ♥ '+u.cost;b.disabled=state.wallet<u.cost;b.onclick=()=>buy(u.id);}
    d.append(b);l.append(d);
  });
  const ms=$('#menuShop');ms.textContent='';
  DISHES.filter(d=>d.unlock).forEach(dd=>{
    const owned=state.dishUnlocks.includes(dd.unlock),i=DISHES.indexOf(dd),d=document.createElement('div');d.className='up'+(owned?' owned':'');
    d.innerHTML='<div style="display:flex;gap:10px;align-items:center"><img alt="" style="width:36px;height:30px;image-rendering:pixelated" src="'+DISH_URL[i]+'"><div><div class="nm"></div><div class="ds"></div></div></div>';
    d.querySelector('.nm').textContent=dd.name;d.querySelector('.ds').textContent='Adds a '+CATS[dd.cat].dishes+' dish to the menu.';
    const b=document.createElement('button');b.className='btn small';
    if(owned){b.textContent='On menu';b.disabled=true;}
    else{b.textContent='Buy ♥ '+dd.cost;b.disabled=state.wallet<dd.cost;b.onclick=()=>buyDish(dd.unlock);}
    d.append(b);ms.append(d);
  });
}
function lovesHTML(i){
  const an=ANIMALS[i],t=state.tried[i]||[],known=t.includes(an.fav);
  let line;
  if(known)line='<img alt="" src="'+DISH_URL[an.fav]+'"><span>'+DISHES[an.fav].name+'</span>';
  else if(!dishAvail(an.fav)&&availDishes().every(d=>t.includes(d)||d===an.dis))line='<span>Maybe not on the menu today?</span>';
  else line='<span>Loves: ???</span>';
  return '<div class="loves">'+line+'</div><div class="loves">Tried '+t.length+'</div>';
}
function card(i){
  const an=ANIMALS[i],h=state.hearts[i]||0,b=document.createElement('button');b.className='card';
  b.innerHTML='<img class="sp" alt="'+an.name+' the '+an.kind+'" src="'+spriteURL(i)+'"><div class="nm">'+an.name+'</div><div class="hearts">♥ '+h+' · Lv '+lvl(h)+'</div>'+lovesHTML(i);
  b.onclick=()=>openDetail(i);return b;
}
function lockedCard(i,label){
  const b=document.createElement('div');b.className='card locked';
  b.innerHTML='<img class="sp" alt="" src="'+spriteURL(i)+'"><div class="nm">???</div><div>'+label+'</div>';return b;
}
function renderGuestbook(){
  const g=$('#guestbook');g.textContent='';
  for(let i=0;i<NORMAL;i++)g.append(i<state.unlocked?card(i):lockedCard(i,i===state.unlocked?'Arriving soon':'Not met yet'));
  const r=$('#rareBook');r.textContent='';
  for(let i=NORMAL;i<ANIMALS.length;i++)r.append(state.rareMet.includes(i)?card(i):lockedCard(i,'Rare visitor'));
}
const FILTERS=[['all','All'],['todo','To do'],['done','Done']];
function renderTabs(){
  const t=$('#tabs');t.textContent='';
  FILTERS.forEach(([k,l])=>{const b=document.createElement('button');b.type='button';b.textContent=l;b.className=state.filter===k?'on':'';b.onclick=()=>{state.filter=k;save();renderTasks();renderTabs();};t.append(b);});
}
function renderTasks(){
  const ul=$('#taskList');ul.textContent='';
  const list=state.tasks.filter(t=>state.filter==='all'||(state.filter==='todo'?!t.done:t.done));
  if(!list.length){const li=document.createElement('li');li.className='empty';li.textContent=state.tasks.length?'Nothing here.':'Nothing yet. Add a task and the kitchen will start warming up.';ul.append(li);}
  list.forEach(t=>{
    const li=document.createElement('li');li.className='task'+(t.done?' done':'');li.dataset.id=t.id;
    if(state.filter==='all'){
      const grip=document.createElement('button');grip.type='button';grip.className='grip';grip.textContent='⠿';grip.setAttribute('aria-label','Drag to reorder');
      grip.onpointerdown=e=>startDrag(e,li,grip);li.append(grip);
    }
    const lab=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;
    cb.onchange=()=>toggleTask(t.id,cb.checked);
    const box=document.createElement('span');box.className='box';
    const tx=document.createElement('span');tx.className='txt';
    const bd=document.createElement('i');bd.className='badge';bd.style.background=CATS[t.cat].color;bd.title=CATS[t.cat].label;
    tx.append(bd,document.createTextNode(t.text));
    const meta=(t.big?'★ ':'')+(t.repeat?'↻ '+t.repeat:'');
    if(meta){const m=document.createElement('span');m.className='meta';m.textContent=meta;tx.append(m);}
    lab.append(cb,box,tx);
    const del=document.createElement('button');del.className='del';del.textContent='×';del.setAttribute('aria-label','Delete task');
    del.onclick=()=>{state.tasks=state.tasks.filter(x=>x.id!==t.id);sfx('del');save();renderAll();};
    li.append(lab,del);ul.append(li);
  });
  $('#leftTxt').textContent=state.tasks.filter(t=>!t.done).length+' to do';
  $('#clearBtn').disabled=!state.tasks.some(t=>t.done&&!t.repeat);
}
function startDrag(e,li,grip){
  e.preventDefault();const ul=$('#taskList');li.classList.add('dragging');grip.setPointerCapture(e.pointerId);
  const move=ev=>{
    const el=document.elementFromPoint(ev.clientX,ev.clientY),over=el&&el.closest('li.task');
    if(over&&over!==li&&over.parentNode===ul){const r=over.getBoundingClientRect();ul.insertBefore(li,ev.clientY<r.top+r.height/2?over:over.nextSibling);}
  };
  const up=()=>{
    grip.removeEventListener('pointermove',move);grip.removeEventListener('pointerup',up);grip.removeEventListener('pointercancel',up);
    li.classList.remove('dragging');
    const ids=[...ul.querySelectorAll('li.task')].map(x=>+x.dataset.id);
    state.tasks.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));save();
  };
  grip.addEventListener('pointermove',move);grip.addEventListener('pointerup',up);grip.addEventListener('pointercancel',up);
}
function renderSound(){
  $('#soundBtn').textContent='Sound: '+(state.muted?'Off':'On');
  $('#musicBtn').textContent='Music: '+(state.music?'On':'Off');
  $('#volume').value=state.volume;
}
function renderAll(){renderTasks();renderPantry();renderServe();renderBubble();renderStats();renderShop();renderGuestbook();renderEvent();}
let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);}

/* ---------- app icon (drawn from pixels, used for tab + home screen) ---------- */
function setIcons(){
  const rows=['............','....kkkk....','..kkBBBBkk..','.kBBbBBBBBk.','.kBBBBBbBBk.','.kkkkkkkkkk.','..kbbbbbbk..','..kbbwbbbk..','..kbbwbbbk..','...kbbbbk...','....kbbk....','.....kk.....'];
  const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  x.fillStyle='#fff3de';x.fillRect(0,0,180,180);
  rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch!=='.'){x.fillStyle=DISH_PAL[ch];x.fillRect(18+i*12,18+j*12,12,12);}}));
  const url=c.toDataURL('image/png');
  $('#touchIcon').href=url;$('#favicon').href=url;
}

/* ---------- wiring ---------- */
$('#addForm').onsubmit=e=>{
  e.preventDefault();const v=$('#taskInput').value.trim();if(!v)return;
  state.tasks.push({id:state.nextId++,text:v,done:false,credited:false,cat:$('#taskCat').value,big:$('#taskBig').checked,repeat:$('#taskRepeat').value});
  $('#taskInput').value='';$('#taskBig').checked=false;sfx('add');save();renderAll();
};
$('#clearBtn').onclick=()=>{state.tasks=state.tasks.filter(t=>!t.done||t.repeat);save();renderAll();};
$('#soundBtn').onclick=()=>{state.muted=!state.muted;save();renderSound();musicSync();sfx('check');};
$('#musicBtn').onclick=()=>{state.music=!state.music;save();renderSound();musicSync();if(state.music)sfx('check');};
$('#volume').oninput=e=>{state.volume=+e.target.value;if(master)master.gain.value=state.volume/100;};
$('#volume').onchange=()=>{save();sfx('check');};
$('#seasonBtn').onclick=()=>{
  state.seasonMode=SEASON_ORDER[(SEASON_ORDER.indexOf(state.seasonMode)+1)%SEASON_ORDER.length];
  save();applySeason();renderAll();
};
$('#timeBtn').onclick=()=>{
  state.timeMode=TIME_ORDER[(TIME_ORDER.indexOf(state.timeMode)+1)%TIME_ORDER.length];
  save();applySeason();
};
$('#exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='acorn-and-crumb-save.json';document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup saved to your downloads.');
};
$('#importBtn').onclick=()=>$('#importFile').click();
$('#importFile').onchange=e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);if(!o||!Array.isArray(o.tasks))throw 0;
      if(!confirm('Replace your current café with this backup?'))return;
      localStorage.setItem(KEY,JSON.stringify(migrate(o)));location.reload();
    }catch(err){toast('That file does not look like an Acorn & Crumb backup.');}
  };
  r.readAsText(f);
};
$('#resetBtn').onclick=()=>{
  if(!confirm('Start over? This clears your tasks, regulars and progress.'))return;
  const keep={seasonMode:state.seasonMode,timeMode:state.timeMode,muted:state.muted,music:state.music,volume:state.volume};
  state=Object.assign(fresh(),keep);newCustomer(0);save();$('#overlay').hidden=true;modalCb=null;forceNext=null;
  setPhase('in');applySeason();renderAll();
};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshRecurring();});
setInterval(refreshRecurring,60000);

/* ---------- boot ---------- */
if(!state.customer)newCustomer(0);
setIcons();refreshRecurring();
applySeason();renderSound();renderTabs();musicSync();
renderAll();
if(state.queue.length){setPhase('gap');nextModal();}else setPhase('in');
requestAnimationFrame(frame);
</script>
</body>
</html>
