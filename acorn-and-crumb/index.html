<!doctype html>
<html lang="en" data-season="autumn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acorn &amp; Crumb</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌰%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2a24;--bg:#e9c89b;--panel:#fff3de;--panel2:#f3dfbd;--accent:#d9702f;}
html[data-season=spring]{--bg:#cfe9c8;--panel:#fff7ea;--panel2:#f6e6d2;--accent:#e9799b}
html[data-season=summer]{--bg:#bfe6f0;--panel:#fffaf0;--panel2:#f7ecd0;--accent:#e8962a}
html[data-season=autumn]{--bg:#e9c89b;--panel:#fff3de;--panel2:#f3dfbd;--accent:#d9702f}
html[data-season=winter]{--bg:#c9d6ea;--panel:#f7f9ff;--panel2:#e3e9f5;--accent:#5f93cf}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background-color:var(--bg);
  background-image:linear-gradient(45deg,rgba(255,255,255,.14) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.14) 75%),
                   linear-gradient(45deg,rgba(255,255,255,.14) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.14) 75%);
  background-size:32px 32px;background-position:0 0,16px 16px;
  font-family:'VT323',ui-monospace,monospace;font-size:22px;line-height:1.15}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1,h2{font-family:'Press Start 2P',ui-monospace,monospace;margin:0;font-weight:400}
h1{font-size:clamp(14px,3.2vw,22px);line-height:1.4}
h2{font-size:14px;margin-bottom:12px}
.panel{background:var(--panel);border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink),inset 0 0 0 3px var(--panel2);padding:16px}
.btn{font:inherit;font-size:20px;color:#fff;background:var(--accent);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:6px 14px;cursor:pointer;text-shadow:1px 1px 0 rgba(0,0,0,.3)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,input:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.btn[disabled]{background:#b9aa98;cursor:not-allowed;filter:none;text-shadow:none;color:#6b5d50}
.btn.ghost{background:var(--panel);color:var(--ink);text-shadow:none}
.btn.small{font-size:18px;padding:3px 10px}
.btn.big{font-size:24px;padding:10px 18px}
.topbtns{display:flex;gap:10px;flex-wrap:wrap}
main{display:grid;gap:20px;grid-template-columns:1.25fr 1fr;grid-template-areas:"cafe todo" "shop todo" "reg todo";align-items:start}
.cafe{grid-area:cafe}.todo{grid-area:todo}.regulars{grid-area:reg}.shop{grid-area:shop}
@media (max-width:820px){main{grid-template-columns:1fr;grid-template-areas:"cafe" "todo" "shop" "reg"}}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.dish{font:inherit;font-size:18px;line-height:1.05;color:var(--ink);background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.dish img{width:48px;height:40px;image-rendering:pixelated}
.dish:hover:not([disabled]){background:var(--panel2)}
.dish:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.dish:focus-visible{outline:3px dashed var(--accent);outline-offset:3px}
.dish[disabled]{opacity:.5;cursor:not-allowed}
.up{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff;border:3px solid var(--ink);padding:8px 10px;margin-bottom:8px}
.up .nm{font-family:'Press Start 2P',monospace;font-size:10px;margin-bottom:4px}
.up .ds{opacity:.8;font-size:19px}
.up.owned{opacity:.65}
.up .btn{flex:none;white-space:nowrap}
.stage{position:relative;border:4px solid var(--ink);background:#000;line-height:0}
canvas#scene{width:100%;height:auto;image-rendering:pixelated;display:block}
.bubble{position:absolute;left:52%;top:3%;max-width:44%;background:#fffdf6;border:3px solid var(--ink);padding:6px 10px;
  display:flex;gap:8px;align-items:center;line-height:1.05;font-size:clamp(14px,2.4vw,21px);transition:opacity .2s}
.bubble::before{content:"";position:absolute;left:-12px;bottom:10px;border:6px solid transparent;border-right:8px solid var(--ink)}
.bubble::after{content:"";position:absolute;left:-7px;bottom:12px;border:4px solid transparent;border-right:6px solid #fffdf6}
.bubble img{width:36px;height:30px;image-rendering:pixelated;flex:none}
.bubble.hidden{opacity:0}
.bubble .tag{display:inline-block;background:var(--accent);color:#fff;padding:0 6px;font-size:.8em}
.serve-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-top:18px}
.pantry{display:flex;flex-direction:column;gap:6px}
.pips{display:flex;gap:6px}
.pip{width:26px;height:26px;border:3px solid var(--ink);background:#fff;opacity:.55}
.pip.on{background:var(--accent);opacity:1;box-shadow:inset -4px -4px 0 rgba(0,0,0,.18),inset 3px 3px 0 rgba(255,255,255,.35)}
.stats{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px 18px;opacity:.85}
form#addForm{display:flex;gap:10px;margin-bottom:12px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:22px;padding:6px 10px;border:3px solid var(--ink);background:#fff;color:var(--ink)}
ul#taskList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);padding:6px 8px}
.task label{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;min-width:0;position:relative}
.task input{position:absolute;opacity:0;width:24px;height:24px;margin:0}
.task .box{width:24px;height:24px;border:3px solid var(--ink);background:#fff;flex:none;display:grid;place-items:center;color:#fff;font-size:20px}
.task input:checked+.box{background:var(--accent)}
.task input:checked+.box::after{content:"✔"}
.task input:focus-visible+.box{outline:3px dashed var(--accent);outline-offset:2px}
.task .txt{overflow-wrap:anywhere}
.task.done .txt{text-decoration:line-through;opacity:.5}
.task .del{background:none;border:none;font:inherit;font-size:24px;color:var(--ink);cursor:pointer;opacity:.5;padding:0 6px}
.task .del:hover{opacity:1}
.todo-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
.empty{opacity:.7;padding:10px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.card{background:#fff;border:3px solid var(--ink);padding:8px;text-align:center;font-size:19px}
.card img.sp{width:72px;height:72px;image-rendering:pixelated}
.card.locked img.sp{filter:brightness(0);opacity:.2}
.card .nm{font-family:'Press Start 2P',monospace;font-size:10px;margin:4px 0}
.card .loves{display:flex;gap:4px;align-items:center;justify-content:center;font-size:17px;opacity:.85}
.card .loves img{width:24px;height:20px;image-rendering:pixelated}
.hearts{color:#e8587a}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,120px);transition:transform .25s;background:var(--panel);border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:8px 16px;z-index:5;max-width:92vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
#overlay{position:fixed;inset:0;background:rgba(40,25,20,.55);display:grid;place-items:center;z-index:10;padding:16px}
#overlay[hidden]{display:none}
#overlay .panel{max-width:380px;text-align:center}
#overlay img{width:144px;height:144px;image-rendering:pixelated}
#overlay .kicker{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--accent);margin-bottom:8px}
#overlay h3{font-family:'Press Start 2P',monospace;font-size:16px;margin:8px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌰 Acorn &amp; Crumb</h1>
    <div class="topbtns">
      <button class="btn ghost small" id="soundBtn" title="Toggle sound effects"></button>
      <button class="btn ghost small" id="seasonBtn" title="Change the season"></button>
      <button class="btn ghost small" id="resetBtn">Start over</button>
    </div>
  </header>

  <main>
    <section class="cafe panel" aria-label="The café">
      <div class="stage">
        <canvas id="scene" width="320" height="176" role="img" aria-label="A cozy café counter with an animal customer waiting"></canvas>
        <div class="bubble hidden" id="bubble" aria-live="polite"></div>
      </div>
      <div class="serve-row">
        <div class="pantry">
          <div class="pips" id="pips" aria-hidden="true"></div>
          <div id="pantryTxt"></div>
        </div>
      </div>
      <div id="menuHint" style="margin:14px 0 8px"></div>
      <div class="menu" id="menu"></div>
      <div class="stats" id="stats"></div>
    </section>

    <section class="todo panel" aria-label="Tasks">
      <h2>Today's tasks</h2>
      <form id="addForm">
        <input type="text" id="taskInput" placeholder="What needs doing?" maxlength="120" autocomplete="off" aria-label="New task">
        <button class="btn">Add</button>
      </form>
      <ul id="taskList"></ul>
      <div class="todo-foot">
        <span id="leftTxt"></span>
        <button class="btn ghost small" id="clearBtn">Clear done</button>
      </div>
    </section>

    <section class="shop panel" aria-label="Café upgrades">
      <h2>Café upgrades</h2>
      <p id="walletTxt" style="margin:0 0 12px"></p>
      <div id="shopList"></div>
    </section>

    <section class="regulars panel" aria-label="Regulars">
      <h2>Regulars</h2>
      <p id="nextHint" style="margin:0 0 12px"></p>
      <div class="grid" id="guestbook"></div>
    </section>
  </main>
</div>

<div id="toast" role="status"></div>
<div id="overlay" hidden>
  <div class="panel">
    <div class="kicker">A NEW REGULAR!</div>
    <img id="ovImg" alt="">
    <h3 id="ovName"></h3>
    <p id="ovText"></p>
    <button class="btn" id="ovBtn">Welcome in!</button>
  </div>
</div>

<script>
'use strict';
/* ---------- tuning ---------- */
const TASKS_PER_ORDER = 3;     // finish this many tasks -> one order is cooked
const ORDERS_PER_REGULAR = 3;  // serve this many orders -> a new regular arrives
const KEY = 'cozy-cafe-v1';

/* ---------- content ---------- */
const DISH_ROWS = {
  cookie:['............','....kkkk....','..kkbbbbkk..','.kbbbBbbbbk.','.kbBbbbbbBk.','.kbbbbBbbbk.','.kbbBbbbbbk.','..kkbbbbkk..','....kkkk....','............'],
  tea:['...s..s.....','....s..s....','............','.kkkkkkkk...','.kwwwwwwkkk.','.kcccccckwk.','.kcccccckwk.','.kcccccckk..','..kccccck...','...kkkkk....'],
  cake:['............','.....rr.....','..kkkkkkkk..','.kppppppppk.','.kwwwwwwwwk.','.kbbbbbbbbk.','.kwwwwwwwwk.','.kbbbbbbbbk.','..kkkkkkkk..','............'],
  soup:['...s...s....','....s...s...','............','..kkkkkkkk..','.kbbggbbbbk.','kkkkkkkkkkkk','kcccccccccck','.kcccccccck.','..kcccccck..','...kkkkkk...'],
  muffin:['............','....kkkk....','..kkbbbbkk..','.kbbbubbbbk.','.kbubbbbbbk.','.kkkkkkkkkk.','..kyyyyyyk..','..kyywyyyk..','..kyyyyyyk..','...kkkkkk...'],
  tart:['............','............','....rr......','..kkkkkkkk..','.krrprrrrrk.','.krrrrrprrk.','.kbbbbbbbbk.','..kbbbbbbk..','...kkkkkk...','............'],
  toast:['............','..kkkkkkkk..','.kyyyyyyyyk.','kyyooyyyoyyk','kyyyyoyyyyyk','kbyyyyyyyybk','.kbbbbbbbbk.','..kkkkkkkk..','............','............']
};
const DISH_PAL = {k:'#3b2a24',w:'#fff4e0',b:'#b9733f',B:'#6b4026',r:'#d9534f',p:'#f4a6b8',y:'#f5d061',o:'#e8923a',g:'#7fb069',c:'#79b4d6',s:'rgba(255,255,255,.75)',u:'#5b6fd1'};
const DISHES = [
  {name:'Acorn Cookie',key:'cookie'},{name:'Moonlit Tea',key:'tea'},{name:'Strawberry Cake',key:'cake'},
  {name:'Mushroom Soup',key:'soup'},{name:'Blueberry Muffin',key:'muffin'},{name:'Berry Tart',key:'tart'},{name:'Honey Toast',key:'toast'}
];
const ANIMALS = [
  {name:'Clover',kind:'bunny',fav:4,cloth:'#e86f8a',hello:'Hop hop! Is this the café everyone whispers about?',line:'So warm and fluffy. Thank you!',favLine:'My absolute favorite! *happy thumping*'},
  {name:'Rusty',kind:'fox',fav:0,cloth:'#3f7ca8',hello:'Smells like cookies in here. I might become a regular.',line:'Delicious. Clever cooking!',favLine:'Acorn cookies! You know me too well.'},
  {name:'Bramble',kind:'hedgehog',fav:3,cloth:'#c9553d',hello:'Oh! A cozy spot. May I curl up by the stove?',line:'*quiet happy snuffles*',favLine:'Mushroom soup... I could cry. Perfect.'},
  {name:'Maple',kind:'bear',fav:6,cloth:'#5b8c5a',hello:'Rrrmph. Heard there was honey. Is there honey?',line:'Mm. Good. Very good.',favLine:'HONEY TOAST. Best day ever.'},
  {name:'Hoot',kind:'owl',fav:1,cloth:'#7b5ea7',hello:'Whooo runs this lovely place? I shall visit nightly.',line:'Most satisfying. Wise choice.',favLine:'Moonlit tea! You have excellent taste.'},
  {name:'Pip',kind:'frog',fav:4,cloth:'#f2b134',hello:'Ribbit! Dropped by after the rain. Got any muffins?',line:'Ribbit! Yummy!',favLine:'Blueberry muffin! *splashy happy dance*'},
  {name:'Bandit',kind:'raccoon',fav:2,cloth:'#3fa89b',hello:'Just passing through. Definitely not here for the cake.',line:'I will be back. For research.',favLine:'Cake! I mean... acceptable. Great!'},
  {name:'Willow',kind:'deer',fav:5,cloth:'#b04a6a',hello:'What a gentle little café. May I stay a while?',line:'Lovely, thank you kindly.',favLine:'A berry tart? My heart is full.'}
];
const SEASONS = {
  spring:{label:'Spring',wall:'#f3e3d3',sky:['#bfe6f5','#dff3fa'],ground:'#9ad17a',leaf:'#f4a9c4',leaf2:'#f9d0df',trunk:'#7a5230',ptype:'petal',pcol:['#f7b6cd','#fbd5e2','#ffffff'],count:22,vy:[10,22],sun:'#fff3a8'},
  summer:{label:'Summer',wall:'#f6e5c4',sky:['#8fd3f0','#c4ecf9'],ground:'#6fbf5a',leaf:'#4fa54a',leaf2:'#6fc45f',trunk:'#7a5230',ptype:'mote',pcol:['#fff3a8','#ffe27a'],count:16,vy:[-4,4],sun:'#fff3a8'},
  autumn:{label:'Autumn',wall:'#ecd3b0',sky:['#f5c98f','#fbe3bd'],ground:'#b8864b',leaf:'#d9702f',leaf2:'#e9a23b',trunk:'#6b4026',ptype:'leaf',pcol:['#d9702f','#e9a23b','#b4501f'],count:20,vy:[14,28],sun:'#f08a3a'},
  winter:{label:'Winter',wall:'#dfe3ee',sky:['#c9d6ea','#e6edf7'],ground:'#f4f7fb',leaf:null,leaf2:null,trunk:'#6b4026',ptype:'snow',pcol:['#ffffff','#e8f0fb'],count:34,vy:[16,30],sun:null}
};
const SEASON_ORDER = ['auto','spring','summer','autumn','winter'];
const UPGRADES = [
  {id:'tip',name:'Tip Jar',desc:'Customers tip +1 heart on every order.',cost:8},
  {id:'lights',name:'Fairy Lights',desc:'Twinkly string lights across the café.',cost:12},
  {id:'planter',name:'Window Planter',desc:'Seasonal blooms on the windowsill.',cost:15},
  {id:'dome',name:'Cake Dome',desc:'A glass dome with a fresh cake on the counter.',cost:20},
  {id:'cat',name:'Café Cat',desc:'A sleepy cat who naps on the counter.',cost:25},
  {id:'lamp',name:'Golden Lamp',desc:'A warmer, glowier hanging lamp.',cost:30}
];
const has = id => state.upgrades.includes(id);

/* ---------- sound (tiny synth, no audio files) ---------- */
let actx=null;
function audio(){
  if(state.muted) return null;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx;}catch(e){return null;}
}
function tone(f,d,type='square',v=.05,delay=0,slideTo){
  const a=audio();if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(f,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03);
}
const SFX={
  add:()=>tone(520,.07),
  check:()=>{tone(660,.08);tone(880,.1,'square',.05,.07);},
  uncheck:()=>tone(330,.09,'triangle',.07),
  del:()=>tone(240,.12,'sawtooth',.03,0,110),
  order:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.14,'square',.05,i*.08)),
  bell:()=>{tone(1568,.25,'sine',.07);tone(2093,.35,'sine',.04,.12);},
  serve:()=>{tone(1318,.55,'sine',.09);tone(1976,.6,'sine',.04,.03);},
  hearts:()=>[1047,1319,1568].forEach((f,i)=>tone(f,.1,'triangle',.06,.25+i*.09)),
  arrive:()=>[392,494,587,784,988,1175].forEach((f,i)=>tone(f,.16,'square',.045,i*.09)),
  buy:()=>{tone(988,.07);tone(1319,.07,'square',.05,.07);tone(1760,.25,'square',.05,.14);},
  deny:()=>tone(150,.15,'square',.05)
};
function sfx(n){try{SFX[n]&&SFX[n]();}catch(e){}}

/* ---------- state ---------- */
function fresh(){return {tasks:[],completed:0,ordersReady:0,served:0,unlocked:1,hearts:{},tried:{},wallet:0,upgrades:[],muted:false,pendingArrival:null,seasonMode:'auto',customer:null,nextId:1};}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(s&&Array.isArray(s.tasks)){
      const o=Object.assign(fresh(),s);
      if(s.wallet===undefined) o.wallet=Object.values(o.hearts||{}).reduce((a,b)=>a+b,0); // earlier saves: hearts already earned become spendable
      return o;
    }
  }catch(e){}
  return fresh();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
let state = load();

/* ---------- pixel sprites ---------- */
function dishCanvas(key){
  const rows=DISH_ROWS[key], c=document.createElement('canvas'); c.width=12; c.height=10;
  const x=c.getContext('2d');
  rows.forEach((r,j)=>[...r.padEnd(12,'.')].forEach((ch,i)=>{ if(ch!=='.'){x.fillStyle=DISH_PAL[ch];x.fillRect(i,j,1,1);} }));
  return c;
}
const DISH_CV = DISHES.map(d=>dishCanvas(d.key));
const DISH_URL = DISH_CV.map(c=>c.toDataURL());

function gridToCanvas(g){
  const c=document.createElement('canvas'); c.width=c.height=18;
  const x=c.getContext('2d'); x.fillStyle='#3b2a24';
  for(let j=0;j<16;j++)for(let i=0;i<16;i++){
    if(!g[j][i]) continue;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=i+dx, ny=j+dy;
      if(nx<0||ny<0||nx>15||ny>15||!g[ny][nx]) x.fillRect(nx+1,ny+1,1,1);
    }
  }
  for(let j=0;j<16;j++)for(let i=0;i<16;i++) if(g[j][i]){x.fillStyle=g[j][i];x.fillRect(i+1,j+1,1,1);}
  return c;
}
function buildAnimal(idx,season){
  const A=ANIMALS[idx], g=Array.from({length:16},()=>Array(16).fill(null));
  const R=(x,y,w,h,c)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++) if(i>=0&&i<16&&j>=0&&j<16) g[j][i]=c;};
  const D='#2b2118',W='#ffffff',PK='#f4a6b8';
  R(3,12,10,4,A.cloth);
  switch(A.kind){
    case 'bunny':{const c='#f2ece2';
      R(4,0,2,6,c);R(10,0,2,6,c);R(5,1,1,4,PK);R(10,1,1,4,PK);R(3,5,10,7,c);
      R(5,8,1,2,D);R(10,8,1,2,D);R(7,10,2,1,PK);R(4,10,1,1,PK);R(11,10,1,1,PK);break;}
    case 'fox':{const c='#e5792f',cr='#fff2df';
      R(3,2,3,4,c);R(10,2,3,4,c);R(3,2,3,1,'#4a2a1a');R(10,2,3,1,'#4a2a1a');R(3,5,10,7,c);
      R(3,9,3,3,cr);R(10,9,3,3,cr);R(6,10,4,2,cr);R(5,8,1,2,D);R(10,8,1,2,D);R(7,10,2,1,D);break;}
    case 'hedgehog':{const s='#5c4033',t='#e8c9a0';
      R(3,3,10,4,s);R(2,5,1,4,s);R(13,5,1,4,s);R(4,2,1,1,s);R(7,2,2,1,s);R(11,2,1,1,s);
      R(4,7,8,5,t);R(5,8,1,2,D);R(10,8,1,2,D);R(7,10,2,1,D);R(4,10,1,1,PK);R(11,10,1,1,PK);break;}
    case 'bear':{const c='#8a5a3b';

function updateParticles(dt,ts){
  const S=SEASONS[curSeason()],t=ts/1000;
  particles.forEach(p=>{
    p.y+=p.vy*dt;
    p.x+=Math.sin(t*(S.ptype==='leaf'?1.6:1)+p.ph)*(S.ptype==='snow'?8:14)*dt;
    if(p.y>WY+WH||p.y<WY-6){p.y=S.vy[0]<0?WY+WH:WY-4;p.x=rnd(WX,WX+WW);}
    if(p.x<WX)p.x=WX+WW;if(p.x>WX+WW)p.x=WX;
  });
}
function updatePhase(ts){
  const el=ts-stage.t0;
  if(stage.phase==='in'&&el>700)setPhase('waiting');
  else if(stage.phase==='eat'&&el>2400)setPhase('out');
  else if(stage.phase==='out'&&el>700){
    if(state.pendingArrival!=null){setPhase('gap');showArrival();}
    else{newCustomer();save();setPhase('in');sfx('bell');}
  }
}

/* ---------- game logic ---------- */
function newCustomer(force){
  let a=force;
  if(a==null){const pool=[];for(let i=0;i<state.unlocked;i++)if(!state.customer||i!==state.customer.animal)pool.push(i);a=pool.length?pool[Math.floor(Math.random()*pool.length)]:0;}
  const an=ANIMALS[a];
  state.customer={animal:a};
}
function serve(dish){
  if(!state.ordersReady||stage.phase!=='waiting')return;
  const c=state.customer,an=ANIMALS[c.animal],fav=dish===an.fav;
  const tried=state.tried[c.animal]||(state.tried[c.animal]=[]);
  stage.disc=fav&&!tried.includes(dish);stage.dish=dish;
  if(!tried.includes(dish))tried.push(dish);
  state.ordersReady--;state.served++;
  const gain=(fav?2:1)+(has('tip')?1:0);
  state.hearts[c.animal]=(state.hearts[c.animal]||0)+(fav?2:1);
  state.wallet+=gain;sfx('serve');sfx('hearts');toast(stage.disc?'You found '+an.name+"'s favorite! +"+gain+' ♥':'+'+gain+' ♥'+(has('tip')?' (tip included)':''));
  stage.line=fav?an.favLine:an.line;stage.fav=fav;spawnHearts(fav?9:5);
  if(state.served%ORDERS_PER_REGULAR===0&&state.unlocked<ANIMALS.length){state.unlocked++;state.pendingArrival=state.unlocked-1;}
  save();setPhase('eat');renderAll();
}
function showArrival(){
  const i=state.pendingArrival,an=ANIMALS[i];
  $('#ovImg').src=spriteURL(i);$('#ovImg').alt=an.name+' the '+an.kind;
  $('#ovName').textContent=an.name+' the '+an.kind;
  $('#ovText').textContent='"'+an.hello+'" Can you figure out what they love most?';
  $('#overlay').hidden=false;$('#ovBtn').focus();sfx('arrive');
}
$('#ovBtn').onclick=()=>{
  const i=state.pendingArrival;state.pendingArrival=null;$('#overlay').hidden=true;
  newCustomer(i);save();setPhase('in');sfx('bell');renderAll();
};
function toggleTask(id,checked){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  t.done=checked;
  if(!checked)sfx('uncheck');
  if(checked&&!t.credited){
    t.credited=true;state.completed++;
    const p=state.completed%TASKS_PER_ORDER;
    if(p===0){state.ordersReady++;sfx('order');toast('Order up! A dish is ready to serve.');}
    else{sfx('check');toast('Ingredient gathered ('+p+'/'+TASKS_PER_ORDER+')');}
  }else if(checked)sfx('check');
  save();renderAll();
}

    const lab=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;
    cb.onchange=()=>toggleTask(t.id,cb.checked);
    const box=document.createElement('span');box.className='box';
    const tx=document.createElement('span');tx.className='txt';tx.textContent=t.text;
    lab.append(cb,box,tx);
    const del=document.createElement('button');del.className='del';del.textContent='×';del.setAttribute('aria-label','Delete task');
    del.onclick=()=>{state.tasks=state.tasks.filter(x=>x.id!==t.id);sfx('del');save();renderAll();};
    li.append(lab,del);ul.append(li);
  });
  const left=state.tasks.filter(t=>!t.done).length;
  $('#leftTxt').textContent=left+' to do';
  $('#clearBtn').disabled=!state.tasks.some(t=>t.done);
}
function renderPantry(){
  const p=state.completed%TASKS_PER_ORDER;
  $('#pips').innerHTML=Array.from({length:TASKS_PER_ORDER},(_,i)=>'<span class="pip'+(i<p?' on':'')+'"></span>').join('');
  $('#pantryTxt').textContent=p+'/'+TASKS_PER_ORDER+' ingredients · '+state.ordersReady+' order'+(state.ordersReady===1?'':'s')+' ready';
}
function buildMenu(){
  const m=$('#menu');m.textContent='';
  DISHES.forEach((d,i)=>{
    const b=document.createElement('button');b.className='dish';b.innerHTML='<img alt="" src="'+DISH_URL[i]+'"><span></span>';
    b.querySelector('span').textContent=d.name;b.onclick=()=>serve(i);m.append(b);
  });
}
function renderServe(){
  const can=stage.phase==='waiting'&&state.ordersReady>0,need=TASKS_PER_ORDER-state.completed%TASKS_PER_ORDER;
  document.querySelectorAll('#menu .dish').forEach(b=>b.disabled=!can);
  $('#menuHint').textContent=can?'Pick something from the menu. Which one will they love?':stage.phase==='waiting'?'Finish '+need+' more task'+(need===1?'':'s')+' to cook an order.':'';
}
function renderBubble(){
  const b=$('#bubble'),c=state.customer;
  if(!c||stage.phase==='in'||stage.phase==='out'||stage.phase==='gap'){b.className='bubble hidden';return;}
  b.className='bubble';
  if(stage.phase==='waiting'){
    const an=ANIMALS[c.animal],n=(state.tried[c.animal]||[]).length;
    b.innerHTML='<span class="hearts">?</span><span>'+an.name+': "'+(n?'Back again! Surprise me.':'Hi! I\'m new here. What would you recommend?')+'"</span>';
  }else{
    b.innerHTML='<span class="hearts">♥</span><span>'+ANIMALS[c.animal].name+': "'+stage.line+'"'+(stage.disc?' <span class="tag">favorite found!</span>':'')+'</span>';
  }
}
function renderStats(){
  $('#stats').innerHTML='<span class="hearts">♥ '+state.wallet+'</span><span>Tasks done: '+state.completed+'</span><span>Orders served: '+state.served+'</span><span>Regulars: '+state.unlocked+'/'+ANIMALS.length+'</span>';
  const need=ORDERS_PER_REGULAR-state.served%ORDERS_PER_REGULAR;
  $('#nextHint').textContent=state.unlocked>=ANIMALS.length?'The whole forest has found your café!':'Serve '+need+' more order'+(need===1?'':'s')+' and someone new will wander in.';
}
function lovesHTML(i){
  const an=ANIMALS[i],t=state.tried[i]||[],known=t.includes(an.fav);
  return '<div class="loves">'+(known?'<img alt="" src="'+DISH_URL[an.fav]+'"><span>'+DISHES[an.fav].name+'</span>':'<span>Loves: ???</span>')+'</div><div class="loves">Tried '+t.length+'/'+DISHES.length+'</div>';
}
function renderGuestbook(){
  const g=$('#guestbook');g.textContent='';
  ANIMALS.forEach((an,i)=>{
    const d=document.createElement('div');
    if(i<state.unlocked){
      d.className='card';
      d.innerHTML='<img class="sp" alt="'+an.name+' the '+an.kind+'" src="'+spriteURL(i)+'"><div class="nm">'+an.name+'</div><div class="hearts">♥ '+(state.hearts[i]||0)+'</div>'+lovesHTML(i);
    }else{
      d.className='card locked';
      d.innerHTML='<img class="sp" alt="" src="'+spriteURL(i)+'"><div class="nm">???</div><div>'+(i===state.unlocked?'Arriving soon':'Not met yet')+'</div>';
    }
    g.append(d);
  });
}
function renderShop(){
  $('#walletTxt').innerHTML='You have <span class="hearts">♥ '+state.wallet+'</span> to spend. Hearts come from serving customers.';
  const l=$('#shopList');l.textContent='';
  UPGRADES.forEach(u=>{
    const owned=has(u.id),d=document.createElement('div');d.className='up'+(owned?' owned':'');
    d.innerHTML='<div><div class="nm"></div><div class="ds"></div></div>';
    d.querySelector('.nm').textContent=u.name;d.querySelector('.ds').textContent=u.desc;
    const b=document.createElement('button');b.className='btn small';
    if(owned){b.textContent='Owned';b.disabled=true;}
    else{b.textContent='Buy ♥ '+u.cost;b.disabled=state.wallet<u.cost;b.onclick=()=>buy(u.id);}
    d.append(b);l.append(d);
  });
}
function buy(id){
  const u=UPGRADES.find(x=>x.id===id);
  if(!u||has(id)||state.wallet<u.cost){sfx('deny');return;}
  state.wallet-=u.cost;state.upgrades.push(id);sfx('buy');toast('Bought: '+u.name+'!');save();renderAll();
}
function renderSound(){$('#soundBtn').textContent='Sound: '+(state.muted?'Off':'On');}
function renderAll(){renderTasks();renderPantry();renderServe();renderBubble();renderStats();renderShop();renderGuestbook();}
let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}

/* ---------- wiring ---------- */
$('#addForm').onsubmit=e=>{
  e.preventDefault();const v=$('#taskInput').value.trim();if(!v)return;
  state.tasks.push({id:state.nextId++,text:v,done:false,credited:false});
  $('#taskInput').value='';sfx('add');save();renderAll();
};
$('#clearBtn').onclick=()=>{state.tasks=state.tasks.filter(t=>!t.done);save();renderAll();};
buildMenu();
$('#soundBtn').onclick=()=>{state.muted=!state.muted;save();renderSound();sfx('check');};
$('#seasonBtn').onclick=()=>{
  state.seasonMode=SEASON_ORDER[(SEASON_ORDER.indexOf(state.seasonMode)+1)%SEASON_ORDER.length];
  save();applySeason();renderAll();
};
$('#resetBtn').onclick=()=>{
  if(!confirm('Start over? This clears your tasks, regulars and progress.'))return;
  const mode=state.seasonMode,muted=state.muted;state=fresh();state.seasonMode=mode;state.muted=muted;newCustomer(0);save();$('#overlay').hidden=true;
  setPhase('in');applySeason();renderAll();
};

/* ---------- boot ---------- */
if(!state.customer)newCustomer(0);
applySeason();
renderSound();
renderAll();
if(state.pendingArrival!=null){setPhase('gap');showArrival();}else setPhase('in');
requestAnimationFrame(frame);
</script>
</body>
</html>
